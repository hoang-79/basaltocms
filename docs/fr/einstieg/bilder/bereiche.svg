<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" role="img" aria-label="L’aide par tâches">
  <title>L’aide par tâches</title>
  <rect width="840" height="420" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">L’aide par tâches</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Chaque domaine s’adresse à un lecteur — commencez par les premiers pas, puis allez là où se trouve votre travail.</text>
  <rect x="24" y="84" width="184" height="148" rx="10" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <polygon points="61.3,107.5 61.3,120.5 50.0,127.0 38.7,120.5 38.7,107.5 50.0,101.0" fill="#e4572e" stroke="none"/>
  <text x="72" y="119" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#b53f1d" text-anchor="start">Premiers pas</text>
  <text x="40" y="154" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#23262b" text-anchor="start">première visite</text>
  <text x="40" y="180" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Installer, visite guidée,</text>
  <text x="40" y="197" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">première page</text>
  <rect x="224" y="84" width="184" height="148" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <polygon points="261.3,107.5 261.3,120.5 250.0,127.0 238.7,120.5 238.7,107.5 250.0,101.0" fill="#23262b" stroke="none"/>
  <text x="272" y="119" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#23262b" text-anchor="start">Rédaction</text>
  <text x="240" y="154" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#23262b" text-anchor="start">gérer les contenus</text>
  <text x="240" y="180" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Pages, blocs, médias,</text>
  <text x="240" y="197" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">traduction, validation</text>
  <rect x="424" y="84" width="184" height="148" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <polygon points="461.3,107.5 461.3,120.5 450.0,127.0 438.7,120.5 438.7,107.5 450.0,101.0" fill="#23262b" stroke="none"/>
  <text x="472" y="119" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#23262b" text-anchor="start">Configuration</text>
  <text x="440" y="154" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#23262b" text-anchor="start">concevoir le site</text>
  <text x="440" y="180" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Aspect, structure, menus,</text>
  <text x="440" y="197" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">types de contenu, en ligne</text>
  <rect x="624" y="84" width="184" height="148" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <polygon points="661.3,107.5 661.3,120.5 650.0,127.0 638.7,120.5 638.7,107.5 650.0,101.0" fill="#23262b" stroke="none"/>
  <text x="672" y="119" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#23262b" text-anchor="start">Administration</text>
  <text x="640" y="154" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#23262b" text-anchor="start">gérer l’installation</text>
  <text x="640" y="180" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Sites, utilisateurs, rôles,</text>
  <text x="640" y="197" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">paramètres, mises à jour</text>
  <rect x="24" y="250" width="184" height="148" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <polygon points="61.3,273.5 61.3,286.5 50.0,293.0 38.7,286.5 38.7,273.5 50.0,267.0" fill="#23262b" stroke="none"/>
  <text x="72" y="285" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#23262b" text-anchor="start">Communauté</text>
  <text x="40" y="320" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#23262b" text-anchor="start">forum et membres</text>
  <text x="40" y="346" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Lire, écrire,</text>
  <text x="40" y="363" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">modérer</text>
  <rect x="224" y="250" width="184" height="148" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <polygon points="261.3,273.5 261.3,286.5 250.0,293.0 238.7,286.5 238.7,273.5 250.0,267.0" fill="#23262b" stroke="none"/>
  <text x="272" y="285" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#23262b" text-anchor="start">Marketplace</text>
  <text x="240" y="320" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#23262b" text-anchor="start">thèmes et plugins</text>
  <text x="240" y="346" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Trouver, essayer,</text>
  <text x="240" y="363" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">proposer</text>
  <rect x="424" y="250" width="184" height="148" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <polygon points="461.3,273.5 461.3,286.5 450.0,293.0 438.7,286.5 438.7,273.5 450.0,267.0" fill="#23262b" stroke="none"/>
  <text x="472" y="285" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#23262b" text-anchor="start">Développeurs</text>
  <text x="440" y="320" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#23262b" text-anchor="start">créer thèmes et modules</text>
  <text x="440" y="346" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Lava, thèmes,</text>
  <text x="440" y="363" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">extensions, API</text>
  <rect x="624" y="250" width="184" height="148" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <polygon points="661.3,273.5 661.3,286.5 650.0,293.0 638.7,286.5 638.7,273.5 650.0,267.0" fill="#23262b" stroke="none"/>
  <text x="672" y="285" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#23262b" text-anchor="start">Exploitation</text>
  <text x="640" y="320" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#23262b" text-anchor="start">faire tourner le serveur</text>
  <text x="640" y="346" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Installation, hébergement,</text>
  <text x="640" y="363" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">sauvegarde, monitoring</text>
</svg>
