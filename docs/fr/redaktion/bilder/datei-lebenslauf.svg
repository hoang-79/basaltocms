<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" role="img" aria-label="Le parcours d’un fichier dans la médiathèque : téléverser, utiliser, corbeille, supprimé définitivement">
  <title>Le parcours d’un fichier dans la médiathèque : téléverser, utiliser, corbeille, supprimé définitivement</title>
  <rect width="820" height="250" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Le parcours d’un fichier</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Ce qui est supprimé reste 30 jours dans la corbeille (réglable) — « Remplacer » échange l’original aussitôt.</text>
  <rect x="32" y="100" width="170" height="52" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="117.0" y="123.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Téléverser</text>
  <text x="117.0" y="139.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">vérifie type et taille</text>
  <path d="M204 126L228 126" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M220.8 129.5L228 126L220.8 122.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="228" y="100" width="170" height="52" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="313.0" y="123.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Utilisé</text>
  <text x="313.0" y="139.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">des pages l’affichent</text>
  <path d="M400 126L424 126" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M416.8 129.5L424 126L416.8 122.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="424" y="100" width="170" height="52" rx="8" fill="#f6f4f0" stroke="#9aa0a6" stroke-width="1.2"/>
  <text x="509.0" y="123.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Corbeille</text>
  <text x="509.0" y="139.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">restaurable</text>
  <path d="M596 126L620 126" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M612.8 129.5L620 126L612.8 122.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="620" y="100" width="170" height="52" rx="8" fill="#f6e1e3" stroke="#f6e1e3" stroke-width="1.2"/>
  <text x="705.0" y="123.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#b8232f" text-anchor="middle">Supprimé</text>
  <text x="705.0" y="139.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">après 30 jours</text>
  <path d="M508 152V188H312V154" stroke="#62676e" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <path d="M312 162L312 154" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M315.5 161.2L312 154L308.5 161.2" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="410" y="204" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11" font-weight="500" fill="#62676e" text-anchor="middle">restaurer</text>
  <text x="32" y="236" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Si vous supprimez un fichier utilisé, la confirmation cite les pages qui l’affichent encore.</text>
</svg>
