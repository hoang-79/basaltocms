<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="Versions : ce qui est publié reste en ligne — on modifie un nouveau brouillon">
  <title>Versions : ce qui est publié reste en ligne — on modifie un nouveau brouillon</title>
  <rect width="820" height="330" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Versions : en ligne et brouillon côte à côte</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Qui modifie une page publiée travaille sur une nouvelle version — le site ne change qu’à la publication.</text>
  <rect x="32" y="96" width="170" height="56" rx="8" fill="#f6f4f0" stroke="#9aa0a6" stroke-width="1.2"/>
  <text x="117.0" y="121.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Version 1</text>
  <text x="117.0" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">archives</text>
  <rect x="232" y="96" width="170" height="56" rx="8" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="317.0" y="121.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#b53f1d" text-anchor="middle">Version 2</text>
  <text x="317.0" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">en ligne</text>
  <rect x="432" y="96" width="170" height="56" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="517.0" y="121.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Version 3</text>
  <text x="517.0" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">brouillon</text>
  <path d="M204 124L230 124" stroke="#9aa0a6" stroke-width="1.6" fill="none"/>
  <path d="M222.8 127.5L230 124L222.8 120.5" stroke="#9aa0a6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M404 124L430 124" stroke="#9aa0a6" stroke-width="1.6" fill="none"/>
  <path d="M422.8 127.5L430 124L422.8 120.5" stroke="#9aa0a6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="517" y="172" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="500" fill="#62676e" text-anchor="middle">↻ s’enregistre après chaque pause</text>
  <rect x="632" y="96" width="170" height="56" rx="8" fill="#ffffff" stroke="#e4572e" stroke-width="1.2"/>
  <text x="717.0" y="121.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Site web</text>
  <text x="717.0" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">affiche la version 2</text>
  <path d="M317 152V194H717V160" stroke="#e4572e" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <path d="M717 168L717 154" stroke="#e4572e" stroke-width="1.6" fill="none"/>
  <path d="M720.5 161.2L717 154L713.5 161.2" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="517" y="208" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="500" fill="#b53f1d" text-anchor="middle">le site affiche la version en ligne</text>
  <text x="32" y="252" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="500" fill="#23262b" text-anchor="start">Restaurer : une version plus ancienne devient le nouveau brouillon (version 4) — l’ancienne reste dans l’historique.</text>
  <text x="32" y="274" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="500" fill="#23262b" text-anchor="start">Comparer : montre champ par champ ce qui a changé par rapport à la version précédente.</text>
  <text x="32" y="296" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="400" fill="#62676e" text-anchor="start">Aperçu : chaque version a son propre lien — aussi pour les personnes sans compte, tant que le lien est valable.</text>
</svg>
