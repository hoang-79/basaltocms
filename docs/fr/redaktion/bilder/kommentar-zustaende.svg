  <text x="32" y="324" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Le spam détecté automatiquement n’est jamais enregistré, seulement compté. Les réponses de la rédaction sont visibles aussitôt.</text>
