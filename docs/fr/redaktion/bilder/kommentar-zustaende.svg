<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 336" width="840" height="336" role="img" aria-label="États d’un commentaire : en attente, validé, spam, supprimé, purge">
  <title>États d’un commentaire : en attente, validé, spam, supprimé, purge</title>
  <rect width="840" height="336" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Les états d’un commentaire</text>
