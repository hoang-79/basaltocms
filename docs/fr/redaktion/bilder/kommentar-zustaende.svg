  <rect x="690" y="158" width="120" height="56" rx="8" fill="#f6f4f0" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="750.0" y="183.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Purge</text>
