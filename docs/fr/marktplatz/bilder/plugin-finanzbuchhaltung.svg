  <rect x="636" y="224" width="180" height="58" rx="8" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="726.0" y="250.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#b53f1d" text-anchor="middle">Clôture</text>
  <text x="726.0" y="266.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">2979, ouverture</text>
  <text x="24" y="316" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Une écriture comptabilisée ne se modifie pas, elle s’extourne — par une contre-écriture.</text>
