<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="Comptabilité : de la facture à l’écriture, au bilan, au compte de résultat et au décompte TVA">
  <title>Comptabilité : de la facture à l’écriture, au bilan, au compte de résultat et au décompte TVA</title>
  <rect width="840" height="330" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Chaque facture se comptabilise seule</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Comptabilité en partie double selon le plan comptable PME — débit et crédit s’équilibrent dans chaque écriture.</text>
