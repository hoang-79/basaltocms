<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="Marketplace : auteur, équipe et installation">
  <title>Marketplace : auteur, équipe et installation</title>
  <rect width="840" height="330" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Trois rôles dans le Marketplace</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">L’auteur soumet, l’équipe vérifie et signe, l’installation vérifie la signature.</text>
  <rect x="24" y="80" width="792" height="66" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="40" y="118" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="700" fill="#23262b" text-anchor="start">Auteur</text>
  <rect x="196" y="105" width="91" height="18" rx="9" fill="#fbe6df" stroke="#fbe6df" stroke-width="1.2"/>
  <text x="241.5" y="118" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">1 Soumettre</text>
  <rect x="350" y="105" width="140" height="18" rx="9" fill="#fbe6df" stroke="#fbe6df" stroke-width="1.2"/>
  <text x="420.0" y="118" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">6 Nouvelle version</text>
  <rect x="24" y="158" width="792" height="66" rx="10" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="40" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="700" fill="#b53f1d" text-anchor="start">Équipe (extranet)</text>
  <rect x="196" y="183" width="105" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
  <text x="248.5" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">2 Automatique</text>
  <rect x="350" y="183" width="63" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
  <text x="381.5" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">3 Revue</text>
  <rect x="504" y="183" width="133" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
  <text x="570.5" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">4 Test en sandbox</text>
  <rect x="658" y="183" width="70" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
  <text x="693.0" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">5 Signer</text>
  <rect x="24" y="236" width="792" height="66" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="40" y="274" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="700" fill="#23262b" text-anchor="start">Installation</text>
  <rect x="196" y="261" width="154" height="18" rx="9" fill="#fbe6df" stroke="#fbe6df" stroke-width="1.2"/>
  <text x="273.0" y="274" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">7 Installer, essayer</text>
  <text x="24" y="318" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Les plugins arrivent par Composer, les thèmes par « Adopter le thème » ou l’essayage — toujours avec une signature vérifiée.</text>
</svg>
