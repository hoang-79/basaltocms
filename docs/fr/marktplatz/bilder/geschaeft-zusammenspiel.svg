  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Chacun fonctionne seul ; si l’autre est là, la connexion s’active d’elle-même.</text>
