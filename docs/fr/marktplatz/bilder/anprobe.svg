  <rect x="538" y="200" width="278" height="52" rx="8" fill="#e2efe7" stroke="#2a744a" stroke-width="1.2"/>
  <text x="550" y="223.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#2a744a" text-anchor="start">Configuration › Thèmes</text>
  <text x="550" y="239.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">choisir — ou terminer l’aperçu</text>
  <text x="24" y="216" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Aussi dans le backend : onglet « Marketplace » › « Essayer » sur chaque carte de thème.</text>
  <text x="24" y="236" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Les thèmes payants exigent d’abord un achat ; le thème reste dans la bibliothèque.</text>
  <text x="24" y="256" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Droit : « Modifier le site ».</text>
</svg>
