  <text x="638" y="212" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">personal data, clean-up,</text>
  <text x="638" y="228" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">search, notifications</text>
  <rect x="24" y="270" width="792" height="40" rx="10" fill="#23262b" stroke="#23262b" stroke-width="1.2"/>
