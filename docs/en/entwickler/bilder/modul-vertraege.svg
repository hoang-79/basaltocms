<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="A module talks to the core only through contracts">
  <title>A module talks to the core only through contracts</title>
  <rect width="840" height="330" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">A module talks to the core only through contracts</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">No access to internal classes — whatever a module needs goes into the contract.</text>
  <rect x="24" y="82" width="792" height="50" rx="10" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="44" y="112" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#b53f1d" text-anchor="start">Module</text>
  <text x="140" y="112" font-family="ui-monospace, 'SF Mono', 'IBM Plex Mono', Menlo, monospace" font-size="12" font-weight="500" fill="#62676e" text-anchor="start">composer.json · service provider · boot()</text>
  <path d="M116 132L116 166" stroke="#e4572e" stroke-width="1.6" fill="none"/>
  <path d="M112.5 158.8L116 166L119.5 158.8" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="24" y="166" width="184" height="84" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
