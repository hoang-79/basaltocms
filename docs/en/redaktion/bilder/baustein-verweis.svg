<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310" role="img" aria-label="Building block as a reference: a change applies on all pages — dissolving makes a copy for one page only">
  <title>Building block as a reference: a change applies on all pages — dissolving makes a copy for one page only</title>
  <rect width="900" height="310" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Building block: change once, effective everywhere</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">“Dissolve” replaces the reference on one page with copies of the blocks — the building block stays.</text>
  <rect x="32" y="120" width="250" height="70" rx="8" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="44" y="152.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#b53f1d" text-anchor="start">Building block</text>
  <text x="44" y="168.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">“Contact bar” · call to action · text</text>
  <rect x="452" y="86" width="200" height="46" rx="8" fill="#ffffff" stroke="#e4572e" stroke-width="1.2"/>
  <text x="464" y="106.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="start">Home page</text>
  <text x="464" y="122.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">shows the building block</text>
  <path d="M284 150L450 109" stroke="#e4572e" stroke-width="1.6" fill="none"/>
  <path d="M443.8 114.1L450 109L442.2 107.3" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="676" y="114" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="500" fill="#b53f1d" text-anchor="start">changes with it</text>
  <rect x="452" y="148" width="200" height="46" rx="8" fill="#ffffff" stroke="#e4572e" stroke-width="1.2"/>
  <text x="464" y="168.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="start">Services</text>
  <text x="464" y="184.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">shows the building block</text>
  <path d="M284 150L450 171" stroke="#e4572e" stroke-width="1.6" fill="none"/>
  <path d="M442.4 173.5L450 171L443.3 166.6" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="676" y="176" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="500" fill="#b53f1d" text-anchor="start">changes with it</text>
  <rect x="452" y="210" width="200" height="46" rx="8" fill="#f6f4f0" stroke="#9aa0a6" stroke-width="1.2"/>
  <text x="464" y="230.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="start">Contact</text>
  <text x="464" y="246.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">copy of the blocks</text>
  <path d="M284 160L450 233" stroke="#62676e" stroke-width="1.6" fill="none" stroke-dasharray="4 4"/>
  <path d="M442.0 233.3L450 233L444.8 226.9" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="676" y="238" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="500" fill="#62676e" text-anchor="start">no longer changes with it</text>
  <text x="32" y="292" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Building blocks exist only at the top level of a block list; a building block contains no building blocks.</text>
</svg>
