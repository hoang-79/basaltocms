<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="Versions: what is published stays live — editing creates a new draft">
  <title>Versions: what is published stays live — editing creates a new draft</title>
  <rect width="820" height="330" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Versions: live and draft side by side</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Editing a published page means working on a new version — the website changes only when you publish.</text>
  <rect x="32" y="96" width="170" height="56" rx="8" fill="#f6f4f0" stroke="#9aa0a6" stroke-width="1.2"/>
  <text x="117.0" y="121.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Version 1</text>
  <text x="117.0" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">archive</text>
  <rect x="232" y="96" width="170" height="56" rx="8" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="317.0" y="121.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#b53f1d" text-anchor="middle">Version 2</text>
  <text x="317.0" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">live</text>
  <rect x="432" y="96" width="170" height="56" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="517.0" y="121.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Version 3</text>
  <text x="517.0" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">draft</text>
  <path d="M204 124L230 124" stroke="#9aa0a6" stroke-width="1.6" fill="none"/>
  <path d="M222.8 127.5L230 124L222.8 120.5" stroke="#9aa0a6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M404 124L430 124" stroke="#9aa0a6" stroke-width="1.6" fill="none"/>
  <path d="M422.8 127.5L430 124L422.8 120.5" stroke="#9aa0a6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="517" y="172" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="500" fill="#62676e" text-anchor="middle">↻ saves itself after every pause</text>
  <rect x="632" y="96" width="170" height="56" rx="8" fill="#ffffff" stroke="#e4572e" stroke-width="1.2"/>
  <text x="717.0" y="121.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Website</text>
  <text x="717.0" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">shows version 2</text>
  <path d="M317 152V194H717V160" stroke="#e4572e" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <path d="M717 168L717 154" stroke="#e4572e" stroke-width="1.6" fill="none"/>
  <path d="M720.5 161.2L717 154L713.5 161.2" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="517" y="208" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="500" fill="#b53f1d" text-anchor="middle">the website shows the live version</text>
  <text x="32" y="252" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="500" fill="#23262b" text-anchor="start">Restore: an older version becomes the new draft (version 4) — the old one stays in the history.</text>
  <text x="32" y="274" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="500" fill="#23262b" text-anchor="start">Compare: shows field by field what has changed compared with the previous version.</text>
  <text x="32" y="296" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="400" fill="#62676e" text-anchor="start">Preview: every version has its own link — also for people without an account, as long as the link is valid.</text>
</svg>
