<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" width="840" height="270" role="img" aria-label="Check chain of an AI suggestion: module, key, function, per-minute limit, daily limit, cost cap, provider">
  <title>Check chain of an AI suggestion: module, key, function, per-minute limit, daily limit, cost cap, provider</title>
  <rect width="840" height="270" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Before a suggestion arrives</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Basalto checks in order. If a stage fails, the window names the reason — nothing is lost.</text>
  <rect x="24" y="92" width="104" height="58" rx="8" fill="#f6f4f0" stroke="#9aa0a6" stroke-width="1.2"/>
  <text x="76.0" y="118.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Module</text>
  <text x="76.0" y="134.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">on for the site</text>
  <rect x="140" y="92" width="104" height="58" rx="8" fill="#f6f4f0" stroke="#9aa0a6" stroke-width="1.2"/>
  <text x="192.0" y="118.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Key</text>
  <text x="192.0" y="134.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">stored</text>
  <path d="M129 121L139 121" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M131.8 124.5L139 121L131.8 117.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="256" y="92" width="104" height="58" rx="8" fill="#f6f4f0" stroke="#9aa0a6" stroke-width="1.2"/>
  <text x="308.0" y="118.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Function</text>
  <text x="308.0" y="134.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">switched on</text>
  <path d="M245 121L255 121" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M247.8 124.5L255 121L247.8 117.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="372" y="92" width="104" height="58" rx="8" fill="#f6f4f0" stroke="#9aa0a6" stroke-width="1.2"/>
  <text x="424.0" y="118.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">10 a minute</text>
  <text x="424.0" y="134.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">per person</text>
  <path d="M361 121L371 121" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M363.8 124.5L371 121L363.8 117.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="488" y="92" width="104" height="58" rx="8" fill="#f6f4f0" stroke="#9aa0a6" stroke-width="1.2"/>
  <text x="540.0" y="118.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Daily limit</text>
  <text x="540.0" y="134.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">100 by default</text>
  <path d="M477 121L487 121" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M479.8 124.5L487 121L479.8 117.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="604" y="92" width="104" height="58" rx="8" fill="#f6f4f0" stroke="#9aa0a6" stroke-width="1.2"/>
  <text x="656.0" y="118.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Cost cap</text>
  <text x="656.0" y="134.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">tokens a month</text>
  <path d="M593 121L603 121" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M595.8 124.5L603 121L595.8 117.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="720" y="92" width="104" height="58" rx="8" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="772.0" y="118.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#b53f1d" text-anchor="middle">Provider</text>
  <text x="772.0" y="134.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">responds</text>
  <path d="M709 121L719 121" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M711.8 124.5L719 121L711.8 117.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M774 152L774 186" stroke="#e4572e" stroke-width="1.6" fill="none"/>
  <path d="M770.5 178.8L774 186L777.5 178.8" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="640" y="188" width="176" height="50" rx="8" fill="#ffffff" stroke="#e4572e" stroke-width="1.2"/>
  <text x="728.0" y="210.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Suggestion shown</text>
  <text x="728.0" y="226.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">current and suggestion</text>
  <text x="24" y="206" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#62676e" text-anchor="start">Grey with “(AI off)”: one of the first three stages is missing.</text>
  <text x="24" y="226" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="400" fill="#62676e" text-anchor="start">Limit or cap reached, provider overloaded: message with “Try again”.</text>
</svg>
