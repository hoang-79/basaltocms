<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="The path of a form submission: spam protection, submission, mail, webhook, bell">
  <title>The path of a form submission: spam protection, submission, mail, webhook, bell</title>
  <rect width="840" height="300" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">The path of a submission</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Each action runs on its own — if the mail fails, the reason is shown on the submission and you can send it again.</text>
  <rect x="32" y="104" width="150" height="56" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="107.0" y="129.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Visitor sends</text>
  <text x="107.0" y="145.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">form on the page</text>
  <path d="M184 132L216 132" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M208.8 135.5L216 132L208.8 128.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="218" y="104" width="150" height="56" rx="8" fill="#f6f4f0" stroke="#9aa0a6" stroke-width="1.2"/>
  <text x="293.0" y="129.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Spam protection</text>
  <text x="293.0" y="145.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">honeypot · time · limit</text>
  <path d="M370 132L402 132" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M394.8 135.5L402 132L394.8 128.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="404" y="104" width="150" height="56" rx="8" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="479.0" y="129.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#b53f1d" text-anchor="middle">Submission</text>
  <text x="479.0" y="145.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">saved</text>
  <rect x="620" y="70" width="180" height="48" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="632" y="91.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="start">Mail to recipients</text>
  <text x="632" y="107.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">set on the form</text>
  <path d="M556 132L618 94" stroke="#e4572e" stroke-width="1.6" fill="none"/>
  <path d="M613.7 100.7L618 94L610.0 94.8" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="620" y="132" width="180" height="48" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="632" y="153.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="start">Webhook</text>
  <text x="632" y="169.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">signed, if set up</text>
  <path d="M556 132L618 156" stroke="#e4572e" stroke-width="1.6" fill="none"/>
  <path d="M610.0 156.6L618 156L612.5 150.2" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="620" y="194" width="180" height="48" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="632" y="215.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="start">Bell</text>
  <text x="632" y="231.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">for “Forms”</text>
  <path d="M556 132L618 218" stroke="#e4572e" stroke-width="1.6" fill="none"/>
  <path d="M611.0 214.2L618 218L616.6 210.1" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="32" y="282" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Without saving (store: false) the values only go on by mail and webhook and disappear afterwards.</text>
</svg>
