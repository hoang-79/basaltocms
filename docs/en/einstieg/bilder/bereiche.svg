<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" role="img" aria-label="Help by task">
  <title>Help by task</title>
  <rect width="840" height="420" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Help by task</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Each area speaks to one reader — start with Getting started, then go where your work is.</text>
  <rect x="24" y="84" width="184" height="148" rx="10" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <polygon points="61.3,107.5 61.3,120.5 50.0,127.0 38.7,120.5 38.7,107.5 50.0,101.0" fill="#e4572e" stroke="none"/>
  <text x="72" y="119" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#b53f1d" text-anchor="start">Getting started</text>
  <text x="40" y="154" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#23262b" text-anchor="start">new to Basalto</text>
  <text x="40" y="180" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Install, tour,</text>
  <text x="40" y="197" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">first page</text>
  <rect x="224" y="84" width="184" height="148" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
