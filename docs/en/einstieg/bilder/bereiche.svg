  <text x="240" y="180" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Pages, blocks, media,</text>
  <text x="240" y="197" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">translation, approval</text>
  <rect x="424" y="84" width="184" height="148" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <polygon points="461.3,107.5 461.3,120.5 450.0,127.0 438.7,120.5 438.7,107.5 450.0,101.0" fill="#23262b" stroke="none"/>
