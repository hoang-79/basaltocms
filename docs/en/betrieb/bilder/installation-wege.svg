<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="Two ways to install">
  <title>Two ways to install</title>
  <rect width="840" height="330" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Two ways to install</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Both end the same: a site with the Starter theme and a one-time link into the backend.</text>
  <rect x="24" y="82" width="388" height="170" rx="10" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="42" y="108" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#b53f1d" text-anchor="start">Web installer</text>
  <text x="42" y="128" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">index.php into an empty folder</text>
  <polygon points="62.7,147.0 62.7,157.0 54.0,162.0 45.3,157.0 45.3,147.0 54.0,142.0" fill="#e4572e" stroke="none"/>
  <text x="54" y="155.6" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="74" y="156" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="500" fill="#23262b" text-anchor="start">open the address</text>
  <polygon points="62.7,179.0 62.7,189.0 54.0,194.0 45.3,189.0 45.3,179.0 54.0,174.0" fill="#e4572e" stroke="none"/>
  <text x="54" y="187.6" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="74" y="188" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="500" fill="#23262b" text-anchor="start">name, email, language</text>
  <polygon points="62.7,211.0 62.7,221.0 54.0,226.0 45.3,221.0 45.3,211.0 54.0,206.0" fill="#e4572e" stroke="none"/>
  <text x="54" y="219.6" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="74" y="220" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="500" fill="#23262b" text-anchor="start">downloads and verifies the release</text>
  <path d="M218 252L420 280" stroke="#e4572e" stroke-width="1.6" fill="none"/>
  <path d="M412.4 282.5L420 280L413.3 275.6" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="428" y="82" width="388" height="170" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="446" y="108" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#23262b" text-anchor="start">Release archive and console</text>
  <text x="446" y="128" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">ZIP from basaltocms.com</text>
  <polygon points="466.7,147.0 466.7,157.0 458.0,162.0 449.3,157.0 449.3,147.0 458.0,142.0" fill="#23262b" stroke="none"/>
  <text x="458" y="155.6" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="478" y="156" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="500" fill="#23262b" text-anchor="start">unpack, .env</text>
  <polygon points="466.7,179.0 466.7,189.0 458.0,194.0 449.3,189.0 449.3,179.0 458.0,174.0" fill="#23262b" stroke="none"/>
  <text x="458" y="187.6" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="478" y="188" font-family="ui-monospace, 'SF Mono', 'IBM Plex Mono', Menlo, monospace" font-size="12" font-weight="500" fill="#23262b" text-anchor="start">php artisan basalto:install</text>
  <polygon points="466.7,211.0 466.7,221.0 458.0,226.0 449.3,221.0 449.3,211.0 458.0,206.0" fill="#23262b" stroke="none"/>
  <text x="458" y="219.6" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="478" y="220" font-family="ui-monospace, 'SF Mono', 'IBM Plex Mono', Menlo, monospace" font-size="12" font-weight="500" fill="#23262b" text-anchor="start">basalto:publish</text>
  <path d="M622 252L420 280" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M426.7 275.6L420 280L427.6 282.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="220" y="280" width="400" height="36" rx="18" fill="#e2efe7" stroke="#e2efe7" stroke-width="1.2"/>
  <text x="420" y="303" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#2a744a" text-anchor="middle">site live · one-time link · set up passkey</text>
</svg>
