<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-label="Polling everywhere, push where set up">
  <title>Polling everywhere, push where set up</title>
  <rect width="840" height="380" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Polling everywhere, push where set up</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Polling works on any hosting; a WebSocket server announces instantly. The browser fetches the content itself.</text>
  <rect x="24" y="110" width="200" height="150" rx="12" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <polygon points="62.4,132.0 62.4,144.0 52.0,150.0 41.6,144.0 41.6,132.0 52.0,126.0" fill="#23262b" stroke="none"/>
  <text x="72" y="143" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#23262b" text-anchor="start">Browser</text>
  <rect x="616" y="110" width="200" height="150" rx="12" fill="#23262b" stroke="#23262b" stroke-width="1.2"/>
  <polygon points="654.4,132.0 654.4,144.0 644.0,150.0 633.6,144.0 633.6,132.0 644.0,126.0" fill="#e4572e" stroke="none"/>
  <text x="664" y="143" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">Basalto</text>
  <text x="640" y="172" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#e3e6ea" text-anchor="start">versions in the cache</text>
  <path d="M224 168L616 168" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M608.8 171.5L616 168L608.8 164.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="420.0" y="162.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="500" fill="#62676e" text-anchor="middle">/_live every 15 s · 204 if nothing is new</text>
  <path d="M616 200L224 200" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M231.2 196.5L224 200L231.2 203.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="316" y="270" width="208" height="64" rx="10" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2" stroke-dasharray="5 4"/>
  <polygon points="348.7,287.0 348.7,297.0 340.0,302.0 331.3,297.0 331.3,287.0 340.0,282.0" fill="#e4572e" stroke="none"/>
  <text x="358" y="297" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="700" fill="#b53f1d" text-anchor="start">Push server</text>
  <text x="340" y="318" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11" font-weight="500" fill="#b53f1d" text-anchor="start">Reverb · Soketi · Laravel Cloud</text>
  <path d="M716 260L528 296" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-dasharray="4 4"/>
  <path d="M534.4 291.2L528 296L535.7 298.1" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M312 296L124 260" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-dasharray="4 4"/>
  <path d="M131.7 257.9L124 260L130.4 264.8" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="536" y="322" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="600" fill="#b53f1d" text-anchor="start">signal without content</text>
  <text x="304" y="322" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="600" fill="#b53f1d" text-anchor="end">instantly via WebSocket</text>
  <text x="44" y="226" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">page with data-live</text>
  <text x="44" y="242" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">polls only while visible</text>
  <text x="420" y="236" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#2a744a" text-anchor="middle">content through the normal address — with all rights</text>
  <text x="420" y="362" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">without a push server: polling only</text>
</svg>
