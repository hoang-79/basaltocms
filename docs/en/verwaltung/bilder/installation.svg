<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-label="Installation, sites, users and roles: what applies where">
  <title>Installation, sites, users and roles: what applies where</title>
  <rect width="840" height="360" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">What applies where</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Roles and some settings apply to the whole installation; role and content per site.</text>
  <rect x="24" y="80" width="792" height="254" rx="10" fill="#f6f4f0" stroke="#9aa0a6" stroke-width="1.2"/>
  <text x="42" y="104" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#23262b" text-anchor="start">Installation</text>
  <text x="150" y="104" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Roles · “Installation” settings · licence · operations · log</text>
  <rect x="44" y="124" width="360" height="190" rx="8" fill="#ffffff" stroke="#e4572e" stroke-width="1.2"/>
  <text x="60" y="150" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="700" fill="#b53f1d" text-anchor="start">Site “Company”</text>
  <text x="60" y="170" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11" font-weight="400" fill="#62676e" text-anchor="start">Languages · domains · theme · modules · “Site” settings</text>
  <rect x="60" y="186" width="328" height="46" rx="8" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="72" y="206.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="start">Anna — Administrator</text>
  <text x="72" y="222.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">one role per site</text>
  <rect x="60" y="244" width="328" height="46" rx="8" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="72" y="264.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="start">Ben — Editor</text>
  <text x="72" y="280.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">one role per site</text>
  <rect x="434" y="124" width="360" height="190" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="450" y="150" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="700" fill="#23262b" text-anchor="start">Site “Club”</text>
  <text x="450" y="170" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11" font-weight="400" fill="#62676e" text-anchor="start">Languages · domains · theme · modules · “Site” settings</text>
  <rect x="450" y="186" width="328" height="46" rx="8" fill="#f6f4f0" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="462" y="206.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="start">Anna — Editor</text>
  <text x="462" y="222.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">one role per site</text>
  <rect x="450" y="244" width="328" height="46" rx="8" fill="#f6f4f0" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="462" y="264.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="start">Chiara — Translator</text>
  <text x="462" y="280.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">one role per site</text>
  <text x="42" y="352" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">A person has exactly one role per site — Anna is Administrator in one site and Editor in the other.</text>
</svg>
