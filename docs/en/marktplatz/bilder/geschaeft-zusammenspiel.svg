  <text x="24" y="326" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">The customer in the CRM lists its invoices, projects and cards under “Linked”.</text>
