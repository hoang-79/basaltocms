  <path d="M412.6 152.9L420 150L413.1 146.0" stroke="#b53f1d" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="596" y="78" width="220" height="50" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="706.0" y="100.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Accounting</text>
  <text x="706.0" y="116.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">Invoice draft</text>
  <path d="M706 128L420 150" stroke="#b53f1d" stroke-width="1.6" fill="none"/>
  <path d="M426.9 146.0L420 150L427.4 152.9" stroke="#b53f1d" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="24" y="252" width="220" height="50" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="134.0" y="274.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Project management</text>
  <text x="134.0" y="290.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">Tasks as a board</text>
  <path d="M134 252L420 214" stroke="#b53f1d" stroke-width="1.6" fill="none"/>
  <path d="M413.3 218.4L420 214L412.4 211.5" stroke="#b53f1d" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
