<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" role="img" aria-label="Working together: CRM, accounting, project management and Kanban board via contracts in the core">
  <title>Working together: CRM, accounting, project management and Kanban board via contracts in the core</title>
  <rect width="840" height="340" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Four plugins, one customer</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Each runs on its own; when the other is there, the connection switches on by itself.</text>
  <rect x="270" y="150" width="300" height="64" rx="12" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="420" y="178" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#b53f1d" text-anchor="middle">Contracts in the core</text>
  <text x="420" y="198" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">no plugin reads another plugin’s tables</text>
  <rect x="24" y="78" width="220" height="50" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="134.0" y="100.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">CRM</text>
  <text x="134.0" y="116.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">Customers</text>
