<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="Marketplace: author, team and installation">
  <title>Marketplace: author, team and installation</title>
  <rect width="840" height="330" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Three roles in the marketplace</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">The author submits, the team checks and signs, the installation verifies the signature.</text>
  <rect x="24" y="80" width="792" height="66" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="40" y="118" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="700" fill="#23262b" text-anchor="start">Author</text>
  <rect x="196" y="105" width="70" height="18" rx="9" fill="#fbe6df" stroke="#fbe6df" stroke-width="1.2"/>
  <text x="231.0" y="118" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">1 Submit</text>
  <rect x="350" y="105" width="105" height="18" rx="9" fill="#fbe6df" stroke="#fbe6df" stroke-width="1.2"/>
  <text x="402.5" y="118" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">6 New version</text>
  <rect x="24" y="158" width="792" height="66" rx="10" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="40" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="700" fill="#b53f1d" text-anchor="start">Team (extranet)</text>
  <rect x="196" y="183" width="91" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
  <text x="241.5" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">2 Automatic</text>
  <rect x="350" y="183" width="70" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
  <text x="385.0" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">3 Review</text>
  <rect x="504" y="183" width="112" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
  <text x="560.0" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">4 Sandbox test</text>
  <rect x="658" y="183" width="56" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
  <text x="686.0" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">5 Sign</text>
  <rect x="24" y="236" width="792" height="66" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="40" y="274" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="700" fill="#23262b" text-anchor="start">Installation</text>
  <rect x="196" y="261" width="133" height="18" rx="9" fill="#fbe6df" stroke="#fbe6df" stroke-width="1.2"/>
  <text x="262.5" y="274" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">7 Install, try on</text>
  <text x="24" y="318" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Plugins come via Composer, themes via “Adopt theme” or the try-on — always with a verified signature.</text>
</svg>
