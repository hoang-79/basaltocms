  <text x="117.0" y="198.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#b53f1d" text-anchor="middle">Tasks</text>
  <text x="117.0" y="214.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">list or Kanban board</text>
  <path d="M212 201.0L224 201.0" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M216.8 204.5L224 201.0L216.8 197.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="226" y="172" width="186" height="58" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="319.0" y="198.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Track time</text>
  <text x="319.0" y="214.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">billable</text>
  <path d="M414 201.0L426 201.0" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M418.8 204.5L426 201.0L418.8 197.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="428" y="172" width="186" height="58" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="521.0" y="198.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Bill</text>
  <text x="521.0" y="214.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">draft in accounting</text>
  <path d="M616 201.0L628 201.0" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M620.8 204.5L628 201.0L620.8 197.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="630" y="172" width="186" height="58" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="723.0" y="198.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Invoice</text>
  <text x="723.0" y="214.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">with QR-bill</text>
  <text x="24" y="276" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Rejected or withdrawn: the change request remains with its history and comments.</text>
</svg>
