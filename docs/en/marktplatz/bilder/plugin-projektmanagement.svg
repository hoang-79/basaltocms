<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-label="Project management: change request from the customer account to the task, time tracked to the invoice">
  <title>Project management: change request from the customer account to the task, time tracked to the invoice</title>
  <rect width="840" height="290" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Change requests approved by the customer</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Customers submit in their customer account, the team estimates, the customer approves — and it becomes a task.</text>
  <rect x="24" y="78" width="146" height="58" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="97.0" y="104.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Submitted</text>
  <text x="97.0" y="120.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">in the customer account</text>
  <path d="M172 107.0L184 107.0" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M176.8 110.5L184 107.0L176.8 103.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="186" y="78" width="146" height="58" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="259.0" y="104.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">In review</text>
  <text x="259.0" y="120.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">team</text>
  <path d="M334 107.0L346 107.0" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M338.8 110.5L346 107.0L338.8 103.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="348" y="78" width="146" height="58" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="421.0" y="104.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Estimated</text>
  <text x="421.0" y="120.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">hours, amount</text>
  <path d="M496 107.0L508 107.0" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M500.8 110.5L508 107.0L500.8 103.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="510" y="78" width="146" height="58" rx="8" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="583.0" y="104.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#b53f1d" text-anchor="middle">Approved</text>
  <text x="583.0" y="120.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">by the customer</text>
  <path d="M658 107.0L670 107.0" stroke="#62676e" stroke-width="1.6" fill="none"/>
