  <rect x="672" y="78" width="146" height="58" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="745.0" y="104.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Implemented</text>
  <text x="745.0" y="120.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">task done</text>
  <path d="M559 136L559 154L117 154" stroke="#b53f1d" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
