  <path d="M80 185L240 185" stroke="#9aa0a6" stroke-width="6" fill="none"/>
  <path d="M80 197L200 197" stroke="#e3e6ea" stroke-width="6" fill="none"/>
  <rect x="40" y="220" width="348" height="40" rx="6" fill="#f6f4f0" stroke="#e3e6ea" stroke-width="1.2"/>
  <polygon points="68.7,235.0 68.7,245.0 60.0,250.0 51.3,245.0 51.3,235.0 60.0,230.0" fill="#23262b" stroke="none"/>
  <path d="M80 235L200 235" stroke="#9aa0a6" stroke-width="6" fill="none"/>
  <path d="M80 247L180 247" stroke="#e3e6ea" stroke-width="6" fill="none"/>
  <rect x="40" y="274" width="348" height="34" rx="8" fill="#ffffff" stroke="#e4572e" stroke-width="1.6"/>
  <text x="56" y="296" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="700" fill="#23262b" text-anchor="start">2 neue Beiträge</text>
  <rect x="304" y="280" width="72" height="22" rx="6" fill="#e4572e" stroke="#e4572e" stroke-width="1.2"/>
  <text x="340" y="295" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Anzeigen</text>
  <rect x="40" y="318" width="348" height="26" rx="6" fill="#f6f4f0" stroke="#e3e6ea" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="56" y="335" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Antworten …</text>
  <rect x="428" y="80" width="388" height="60" rx="10" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <polygon points="461.5,104.5 461.5,115.5 452.0,121.0 442.5,115.5 442.5,104.5 452.0,99.0" fill="#e4572e" stroke="none"/>
  <text x="472" y="104" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="700" fill="#b53f1d" text-anchor="start">Im Thema</text>
  <text x="472" y="122" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Leiste vor dem Antwortformular,</text>
  <text x="472" y="136" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">auch während Sie schreiben</text>
  <rect x="428" y="150" width="388" height="60" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <polygon points="461.5,174.5 461.5,185.5 452.0,191.0 442.5,185.5 442.5,174.5 452.0,169.0" fill="#23262b" stroke="none"/>
  <text x="472" y="174" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="700" fill="#23262b" text-anchor="start">In Forum und Übersicht</text>
  <text x="472" y="192" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">«Neue Beiträge — Aktualisieren»</text>
  <rect x="428" y="220" width="388" height="60" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <polygon points="461.5,244.5 461.5,255.5 452.0,261.0 442.5,255.5 442.5,244.5 452.0,239.0" fill="#23262b" stroke="none"/>
  <text x="472" y="244" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="700" fill="#23262b" text-anchor="start">Im Kopf</text>
  <text x="472" y="262" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Glocke und Nachrichten</text>
  <text x="472" y="276" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">zählen von selbst mit</text>
  <rect x="428" y="290" width="388" height="60" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <polygon points="461.5,314.5 461.5,325.5 452.0,331.0 442.5,325.5 442.5,314.5 452.0,309.0" fill="#23262b" stroke="none"/>
  <text x="472" y="314" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="700" fill="#23262b" text-anchor="start">Auf dem Desktop</text>
  <text x="472" y="332" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">auf Wunsch, wenn das Forum</text>
  <text x="472" y="346" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">im Hintergrund offen ist</text>
</svg>
