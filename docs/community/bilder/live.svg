<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-label="Neues ohne Neuladen">
  <title>Neues ohne Neuladen</title>
  <rect width="840" height="380" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Neues ohne Neuladen</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Das Forum meldet neue Beiträge, Antworten und Nachrichten selbst — ein Klick holt sie in die Seite.</text>
  <rect x="24" y="76" width="380" height="280" rx="12" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <rect x="24" y="76" width="380" height="30" rx="12" fill="#f6f4f0" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="44" y="96" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="700" fill="#23262b" text-anchor="start">Thema</text>
  <rect x="40" y="120" width="348" height="40" rx="6" fill="#f6f4f0" stroke="#e3e6ea" stroke-width="1.2"/>
  <polygon points="68.7,135.0 68.7,145.0 60.0,150.0 51.3,145.0 51.3,135.0 60.0,130.0" fill="#e4572e" stroke="none"/>
  <path d="M80 135L280 135" stroke="#9aa0a6" stroke-width="6" fill="none"/>
  <path d="M80 147L220 147" stroke="#e3e6ea" stroke-width="6" fill="none"/>
