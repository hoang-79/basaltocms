  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Der Anbieter bestätigt die Person; Basalto entscheidet, ob sie hinein darf und mit welcher Rolle.</text>
