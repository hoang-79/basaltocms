<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-label="Anmelden über SSO">
  <title>Anmelden über SSO</title>
  <rect width="840" height="240" fill="#f6f4f0"/>
