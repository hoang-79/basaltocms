  <text x="532" y="246.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">für page · Layout standard</text>
  <path d="M660 172L660 202" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M656.5 194.8L660 202L663.5 194.8" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="520" y="296" width="280" height="58" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="532" y="322.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="start">füllt main und footer</text>
  <text x="532" y="338.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">region main: content</text>
  <path d="M660 264L660 294" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M656.5 286.8L660 294L663.5 286.8" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M518 336L426 200" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-dasharray="4 4"/>
  <path d="M432.9 204.0L426 200L427.2 207.9" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="520" y="380" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="600" fill="#23262b" text-anchor="start">«landing» erweitert «standard» (extends)</text>
  <text x="520" y="398" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">und fügt die Region hero vor main ein.</text>
