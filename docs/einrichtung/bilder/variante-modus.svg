<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="Bildvariante: Modus proportional, Rahmen und exakt am Beispiel eines Querformats">
  <title>Bildvariante: Modus proportional, Rahmen und exakt am Beispiel eines Querformats</title>
  <rect width="840" height="330" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Drei Arten, ein Bild zu verkleinern</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Dasselbe Querformat, Variante 400 × 300 px. Nur «exakt» schneidet — der Fokuspunkt aus der Mediathek bestimmt den Ausschnitt.</text>
  <text x="30" y="98" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#23262b" text-anchor="start">proportional</text>
  <text x="30" y="116" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">nur die Breite zählt</text>
  <rect x="30" y="136" width="200" height="133" rx="4" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <path d="M30 280L230 280" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M222.8 283.5L230 280L222.8 276.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M230 280L30 280" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M37.2 276.5L30 280L37.2 283.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="296" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11" font-weight="600" fill="#62676e" text-anchor="middle">400</text>
  <text x="30" y="318" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11" font-weight="400" fill="#62676e" text-anchor="start">Höhe folgt dem Bild: 400 × 267</text>
  <text x="300" y="98" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#23262b" text-anchor="start">Rahmen</text>
  <text x="300" y="116" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">passt ins Mass</text>
  <rect x="300" y="136" width="200" height="150" rx="4" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="300" y="144" width="200" height="133" rx="4" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="300" y="318" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11" font-weight="400" fill="#62676e" text-anchor="start">ganz sichtbar: 400 × 267, nichts abgeschnitten</text>
  <text x="570" y="98" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#b53f1d" text-anchor="start">exakt</text>
  <text x="570" y="116" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">schneidet aufs Mass</text>
  <rect x="550" y="128" width="240" height="160" rx="4" fill="#f6f4f0" stroke="#e3e6ea" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="570" y="136" width="200" height="150" rx="4" fill="#fbe6df" stroke="#e4572e" stroke-width="2"/>
  <circle cx="690" cy="200" r="7" fill="#ffffff" stroke="#e4572e" stroke-width="2.5"/>
  <text x="644" y="224" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="start">Fokuspunkt</text>
  <text x="570" y="318" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11" font-weight="400" fill="#62676e" text-anchor="start">genau 400 × 300, Rand fällt weg</text>
</svg>
