<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="Ein Baustein auf mehreren Seiten — und was Auflösen bewirkt">
  <title>Ein Baustein auf mehreren Seiten — und was Auflösen bewirkt</title>
  <rect width="840" height="300" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Einmal ändern, überall wirksam</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Seiten verweisen auf den Baustein. Auflösen setzt seine Blöcke als eigene Blöcke in jede Seite — danach ist er weg.</text>
