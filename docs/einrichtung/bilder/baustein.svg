  <text x="40" y="284" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Ein Baustein enthält keine Bausteine. Löschen geht nur, wenn er auf keiner Seite steht — sonst erst auflösen.</text>
