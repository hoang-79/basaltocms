<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="Vom Theme im Ordner zur eigenen Fassung: übernehmen, Entwurf, einreichen, veröffentlichen">
  <title>Vom Theme im Ordner zur eigenen Fassung: übernehmen, Entwurf, einreichen, veröffentlichen</title>
  <rect width="840" height="300" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Wie eine Änderung am Theme live geht</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Wie bei Inhalten: erst Entwurf, dann Freigabe. Wer Entwürfe schreibt oder einreicht, gibt sie nicht selbst frei.</text>
  <rect x="24" y="98" width="148" height="64" rx="8" fill="#f6f4f0" stroke="#9aa0a6" stroke-width="1.2"/>
  <text x="98.0" y="127.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Ordner</text>
  <text x="98.0" y="143.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">nur lesen</text>
  <rect x="186" y="98" width="148" height="64" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="260.0" y="127.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Datenbank</text>
  <text x="260.0" y="143.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">übernehmen</text>
  <path d="M174 130L184 130" stroke="#62676e" stroke-width="1.6" fill="none"/>
