<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="Marktplatz: Autorin, Team und Installation">
  <title>Marktplatz: Autorin, Team und Installation</title>
  <rect width="840" height="330" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Drei Rollen im Marktplatz</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Die Autorin reicht ein, das Team prüft und signiert, die Installation prüft die Signatur.</text>
  <rect x="24" y="80" width="792" height="66" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="40" y="118" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="700" fill="#23262b" text-anchor="start">Autorin</text>
  <rect x="196" y="105" width="98" height="18" rx="9" fill="#fbe6df" stroke="#fbe6df" stroke-width="1.2"/>
  <text x="245.0" y="118" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">1 Einreichen</text>
  <rect x="350" y="105" width="112" height="18" rx="9" fill="#fbe6df" stroke="#fbe6df" stroke-width="1.2"/>
  <text x="406.0" y="118" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">6 neue Version</text>
  <rect x="24" y="158" width="792" height="66" rx="10" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="40" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="700" fill="#b53f1d" text-anchor="start">Team (Extranet)</text>
  <rect x="196" y="183" width="105" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
  <text x="248.5" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">2 Automatisch</text>
  <rect x="350" y="183" width="98" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
  <text x="399.0" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">3 Durchsicht</text>
  <rect x="504" y="183" width="112" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
  <text x="560.0" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">4 Sandbox-Test</text>
  <rect x="658" y="183" width="91" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
  <text x="703.5" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">5 Signieren</text>
  <rect x="24" y="236" width="792" height="66" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="40" y="274" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="700" fill="#23262b" text-anchor="start">Installation</text>
  <rect x="196" y="261" width="203" height="18" rx="9" fill="#fbe6df" stroke="#fbe6df" stroke-width="1.2"/>
  <text x="297.5" y="274" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">7 Installieren, anprobieren</text>
  <text x="24" y="318" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Plugins kommen per Composer, Themes über «Theme übernehmen» oder die Anprobe — immer mit geprüfter Signatur.</text>
</svg>
