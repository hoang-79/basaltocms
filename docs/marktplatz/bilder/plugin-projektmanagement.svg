  <text x="723.0" y="198.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Rechnung</text>
  <text x="723.0" y="214.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">mit QR-Rechnung</text>
  <text x="24" y="276" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Abgelehnt oder zurückgezogen: Der Change Request bleibt mit Verlauf und Kommentaren stehen.</text>
