<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-label="Projektmanagement: Change Request vom Kundenkonto bis zur Aufgabe, erfasste Zeit bis zur Rechnung">
  <title>Projektmanagement: Change Request vom Kundenkonto bis zur Aufgabe, erfasste Zeit bis zur Rechnung</title>
  <rect width="840" height="290" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Change Requests mit Freigabe durch den Kunden</text>
