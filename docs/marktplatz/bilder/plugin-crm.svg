  <text x="24" y="348" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Ändert sich der Kunde im CRM, folgen Rechnungen, Projekte und Karten; beim Kunden stehen sie als «Verknüpft».</text>
