  <text x="70" y="226" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">contenuto della pagina (blocchi)</text>
  <text x="412" y="207" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#62676e" text-anchor="end">dal template</text>
