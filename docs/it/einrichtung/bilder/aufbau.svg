  <path d="M432.9 204.0L426 200L427.2 207.9" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="520" y="380" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="600" fill="#23262b" text-anchor="start">«landing» estende «standard» (extends)</text>
  <text x="520" y="398" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">e aggiunge la regione hero prima di main.</text>
