<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-label="Che cosa fa «Metti online»: contenuti iniziali, otto verifiche, cache delle pagine, online">
  <title>Che cosa fa «Metti online»: contenuti iniziali, otto verifiche, cache delle pagine, online</title>
  <rect width="840" height="290" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Un’esecuzione della stazione Z</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">La stessa esecuzione di basalto:publish. Gli errori tengono il sito offline — gli avvisi no.</text>
  <rect x="30" y="96" width="180" height="64" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="120.0" y="125.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Contenuti iniziali</text>
  <text x="120.0" y="141.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">inserisce i mancanti</text>
  <rect x="230" y="96" width="180" height="64" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="320.0" y="125.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">8 verifiche</text>
  <text x="320.0" y="141.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">linea rossa → moduli</text>
  <path d="M212 128L228 128" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M220.8 131.5L228 128L220.8 124.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="430" y="96" width="180" height="64" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="520.0" y="125.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Cache delle pagine</text>
  <text x="520.0" y="141.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">preriscaldata</text>
  <path d="M412 128L428 128" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M420.8 131.5L428 128L420.8 124.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="630" y="96" width="180" height="64" rx="8" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="720.0" y="125.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#b53f1d" text-anchor="middle">online</text>
  <text x="720.0" y="141.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">i visitatori vedono il sito</text>
  <path d="M612 128L628 128" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M620.8 131.5L628 128L620.8 124.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M320 164L320 200" stroke="#b8232f" stroke-width="1.6" fill="none" stroke-dasharray="4 4"/>
  <path d="M316.5 192.8L320 200L323.5 192.8" stroke="#b8232f" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="210" y="202" width="220" height="52" rx="8" fill="#ffffff" stroke="#b8232f" stroke-width="1.2"/>
  <text x="320.0" y="225.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#b8232f" text-anchor="middle">Errore</text>
  <text x="320.0" y="241.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">resta offline — «Presto online»</text>
  <text x="460" y="226" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="600" fill="#62676e" text-anchor="start">Gli avvisi (per esempio una pagina legale vuota)</text>
  <text x="460" y="244" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">compaiono nelle segnalazioni, ma non bloccano.</text>
</svg>
