<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="Versioni: resta online ciò che è pubblicato — si modifica una nuova bozza">
  <title>Versioni: resta online ciò che è pubblicato — si modifica una nuova bozza</title>
  <rect width="820" height="330" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Versioni: online e bozza fianco a fianco</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Chi modifica una pagina pubblicata lavora su una nuova versione — il sito cambia solo alla pubblicazione.</text>
  <rect x="32" y="96" width="170" height="56" rx="8" fill="#f6f4f0" stroke="#9aa0a6" stroke-width="1.2"/>
  <text x="117.0" y="121.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Versione 1</text>
  <text x="117.0" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">archivio</text>
  <rect x="232" y="96" width="170" height="56" rx="8" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="317.0" y="121.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#b53f1d" text-anchor="middle">Versione 2</text>
  <text x="317.0" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">online</text>
  <rect x="432" y="96" width="170" height="56" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="517.0" y="121.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Versione 3</text>
  <text x="517.0" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">bozza</text>
  <path d="M204 124L230 124" stroke="#9aa0a6" stroke-width="1.6" fill="none"/>
  <path d="M222.8 127.5L230 124L222.8 120.5" stroke="#9aa0a6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M404 124L430 124" stroke="#9aa0a6" stroke-width="1.6" fill="none"/>
  <path d="M422.8 127.5L430 124L422.8 120.5" stroke="#9aa0a6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="517" y="172" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="500" fill="#62676e" text-anchor="middle">↻ si salva dopo ogni pausa</text>
  <rect x="632" y="96" width="170" height="56" rx="8" fill="#ffffff" stroke="#e4572e" stroke-width="1.2"/>
  <text x="717.0" y="121.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Sito web</text>
  <text x="717.0" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">mostra la versione 2</text>
  <path d="M317 152V194H717V160" stroke="#e4572e" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <path d="M717 168L717 154" stroke="#e4572e" stroke-width="1.6" fill="none"/>
  <path d="M720.5 161.2L717 154L713.5 161.2" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="517" y="208" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="500" fill="#b53f1d" text-anchor="middle">il sito mostra la versione online</text>
  <text x="32" y="252" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="500" fill="#23262b" text-anchor="start">Ripristina: una versione precedente diventa la nuova bozza (versione 4) — quella vecchia resta nella cronologia.</text>
  <text x="32" y="274" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="500" fill="#23262b" text-anchor="start">Confronta: mostra campo per campo che cosa è cambiato rispetto alla versione precedente.</text>
  <text x="32" y="296" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="400" fill="#62676e" text-anchor="start">Anteprima: ogni versione ha un proprio link — anche per persone senza account, finché il link è valido.</text>
</svg>
