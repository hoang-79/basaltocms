  <path d="M409.2 262.5L402 266L409.2 269.5" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="440" y="298" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="600" fill="#b53f1d" text-anchor="middle">«Approva» lo recupera</text>
  <rect x="690" y="158" width="120" height="56" rx="8" fill="#f6f4f0" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="750.0" y="183.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Eliminazione</text>
  <text x="750.0" y="199.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">dopo il termine</text>
  <path d="M632 124L688 176" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M680.4 173.6L688 176L685.1 168.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M632 250L688 198" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M685.1 205.5L688 198L680.4 200.4" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="32" y="324" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Lo spam riconosciuto automaticamente non viene mai salvato, solo contato. Le risposte della redazione sono subito visibili.</text>
