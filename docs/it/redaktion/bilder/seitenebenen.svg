  <text x="38" y="424" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="500" fill="#b53f1d" text-anchor="start">Se manca una versione, vale lo slug della lingua di riserva — senza versione in tutta la catena, lì la pagina non ha indirizzo.</text>
