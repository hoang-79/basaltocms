<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="Dalla modifica alla pubblicazione">
  <title>Dalla modifica alla pubblicazione</title>
  <rect width="840" height="300" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Dalla modifica alla pubblicazione</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Ogni modifica è una versione. Va online solo dopo l’approvazione — fino ad allora i visitatori vedono la precedente.</text>
  <path d="M110 112L730.0 112" stroke="#e4572e" stroke-width="2.4" fill="none"/>
  <polygon points="127.3,102.0 127.3,122.0 110.0,132.0 92.7,122.0 92.7,102.0 110.0,92.0" fill="#e4572e" stroke="none"/>
  <text x="110.0" y="116.68" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="110.0" y="156" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="700" fill="#23262b" text-anchor="middle">Bozza</text>
  <text x="110.0" y="174" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11" font-weight="400" fill="#62676e" text-anchor="middle">Lei scrive;</text>
  <text x="110.0" y="189" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11" font-weight="400" fill="#62676e" text-anchor="middle">Basalto salva</text>
  <polygon points="334.0,102.0 334.0,122.0 316.7,132.0 299.3,122.0 299.3,102.0 316.7,92.0" fill="#e4572e" stroke="none"/>
  <text x="316.66666666666663" y="116.68" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="316.66666666666663" y="156" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="700" fill="#23262b" text-anchor="middle">In verifica</text>
  <text x="316.66666666666663" y="174" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11" font-weight="400" fill="#62676e" text-anchor="middle">«Invia»</text>
  <polygon points="540.7,102.0 540.7,122.0 523.3,132.0 506.0,122.0 506.0,102.0 523.3,92.0" fill="#e4572e" stroke="none"/>
  <text x="523.3333333333333" y="116.68" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="523.3333333333333" y="156" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="700" fill="#23262b" text-anchor="middle">Approvato</text>
  <text x="523.3333333333333" y="174" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11" font-weight="400" fill="#62676e" text-anchor="middle">«Approva»</text>
  <polygon points="747.3,102.0 747.3,122.0 730.0,132.0 712.7,122.0 712.7,102.0 730.0,92.0" fill="#e4572e" stroke="none"/>
  <text x="730.0" y="116.68" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="730.0" y="156" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="700" fill="#23262b" text-anchor="middle">Pubblicato</text>
  <text x="730.0" y="174" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11" font-weight="400" fill="#62676e" text-anchor="middle">«Pubblica»</text>
  <text x="730.0" y="189" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11" font-weight="400" fill="#62676e" text-anchor="middle">o pianifica</text>
  <rect x="70" y="222" width="290" height="26" rx="13" fill="#fbe6df" stroke="#fbe6df" stroke-width="1.2"/>
  <text x="215" y="239" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="600" fill="#b53f1d" text-anchor="middle">Redattore</text>
  <rect x="380" y="222" width="400" height="26" rx="13" fill="#e2efe7" stroke="#e2efe7" stroke-width="1.2"/>
  <text x="580" y="239" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="600" fill="#2a744a" text-anchor="middle">Approvatore</text>
  <text x="420" y="280" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">Con tutti i diritti (gestore, amministratore) compie Lei i passi — con i quattro occhi approva qualcun altro.</text>
</svg>
