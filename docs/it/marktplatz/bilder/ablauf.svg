<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="Marketplace: autore, team e installazione">
  <title>Marketplace: autore, team e installazione</title>
  <rect width="840" height="330" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Tre ruoli nel Marketplace</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">L’autore invia, il team verifica e firma, l’installazione verifica la firma.</text>
  <rect x="24" y="80" width="792" height="66" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="40" y="118" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="700" fill="#23262b" text-anchor="start">Autore</text>
  <rect x="196" y="105" width="77" height="18" rx="9" fill="#fbe6df" stroke="#fbe6df" stroke-width="1.2"/>
  <text x="234.5" y="118" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">1 Inviare</text>
  <rect x="350" y="105" width="126" height="18" rx="9" fill="#fbe6df" stroke="#fbe6df" stroke-width="1.2"/>
  <text x="413.0" y="118" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">6 Nuova versione</text>
  <rect x="24" y="158" width="792" height="66" rx="10" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="40" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="700" fill="#b53f1d" text-anchor="start">Team (extranet)</text>
  <rect x="196" y="183" width="98" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
  <text x="245.0" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">2 Automatico</text>
  <rect x="350" y="183" width="91" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
  <text x="395.5" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">3 Revisione</text>
  <rect x="504" y="183" width="133" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
  <text x="570.5" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">4 Test in sandbox</text>
  <rect x="658" y="183" width="77" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
  <text x="696.5" y="196" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">5 Firmare</text>
  <rect x="24" y="236" width="792" height="66" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="40" y="274" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="700" fill="#23262b" text-anchor="start">Installazione</text>
  <rect x="196" y="261" width="161" height="18" rx="9" fill="#fbe6df" stroke="#fbe6df" stroke-width="1.2"/>
  <text x="276.5" y="274" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#b53f1d" text-anchor="middle">7 Installare, provare</text>
  <text x="24" y="318" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">I plugin arrivano tramite Composer, i temi tramite «Adotta tema» o la prova — sempre con firma verificata.</text>
</svg>
