  <text x="32" y="324" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Automatisch erkannter Spam wird nie gespeichert, nur gezählt. Antworten der Redaktion sind sofort sichtbar.</text>
