<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 336" width="840" height="336" role="img" aria-label="Zustände eines Kommentars: wartet, freigegeben, Spam, gelöscht, Löschlauf">
  <title>Zustände eines Kommentars: wartet, freigegeben, Spam, gelöscht, Löschlauf</title>
  <rect width="840" height="336" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Die Zustände eines Kommentars</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Die Moderation des Blocks entscheidet, ob ein Kommentar zuerst wartet. «Freigeben» holt auch Entferntes zurück.</text>
  <rect x="32" y="158" width="140" height="56" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="102.0" y="183.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="middle">Kommentar</text>
