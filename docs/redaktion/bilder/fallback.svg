<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="820" height="220" role="img" aria-label="Rückfallsprache: fehlt eine Sprache, zeigt die Website die nächste in der Kette">
  <title>Rückfallsprache: fehlt eine Sprache, zeigt die Website die nächste in der Kette</title>
  <rect width="820" height="220" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Rückfallsprache (Fallback)</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">Fehlt die veröffentlichte Fassung, sehen Besucher die nächste Sprache der Kette — am Ende die Standardsprache.</text>
  <rect x="60" y="96" width="180" height="56" rx="8" fill="#f6e1e3" stroke="#f6e1e3" stroke-width="1.2"/>
  <text x="150.0" y="121.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#b8232f" text-anchor="middle">IT</text>
  <text x="150.0" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">nicht veröffentlicht</text>
  <path d="M242 124L298 124" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M290.8 127.5L298 124L290.8 120.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="270.0" y="118.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="500" fill="#62676e" text-anchor="middle">fehlt?</text>
  <rect x="300" y="96" width="180" height="56" rx="8" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="390.0" y="121.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#62676e" text-anchor="middle">EN</text>
  <text x="390.0" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">Rückfall von IT</text>
  <path d="M482 124L538 124" stroke="#62676e" stroke-width="1.6" fill="none"/>
  <path d="M530.8 127.5L538 124L530.8 120.5" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="510.0" y="118.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="500" fill="#62676e" text-anchor="middle">fehlt?</text>
  <rect x="540" y="96" width="180" height="56" rx="8" fill="#fbe6df" stroke="#fbe6df" stroke-width="1.2"/>
  <text x="630.0" y="121.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#b53f1d" text-anchor="middle">DE</text>
  <text x="630.0" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="middle">Standardsprache</text>
  <text x="60" y="186" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12" font-weight="500" fill="#23262b" text-anchor="start">Die Kette stellt eine Administratorin unter Verwaltung › Sites › Sprachen ein (Spalte «Fallback»).</text>
</svg>
