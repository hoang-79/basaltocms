<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310" role="img" aria-label="Baustein als Verweis: eine Änderung wirkt auf allen Seiten — Auflösen macht eine Kopie nur für eine Seite">
  <title>Baustein als Verweis: eine Änderung wirkt auf allen Seiten — Auflösen macht eine Kopie nur für eine Seite</title>
  <rect width="900" height="310" fill="#f6f4f0"/>
  <text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#23262b" text-anchor="start">Baustein: einmal ändern, überall wirksam</text>
  <text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="400" fill="#62676e" text-anchor="start">«Auflösen» ersetzt den Verweis auf einer Seite durch Kopien der Blöcke — der Baustein bleibt.</text>
  <rect x="32" y="120" width="200" height="70" rx="8" fill="#fbe6df" stroke="#e4572e" stroke-width="1.2"/>
  <text x="44" y="152.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#b53f1d" text-anchor="start">Baustein «Kontaktleiste»</text>
  <text x="44" y="168.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Aufruf · Text</text>
  <rect x="452" y="86" width="200" height="46" rx="8" fill="#ffffff" stroke="#e4572e" stroke-width="1.2"/>
  <text x="464" y="106.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="start">Startseite</text>
  <text x="464" y="122.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">zeigt den Baustein</text>
  <path d="M234 150L450 109" stroke="#e4572e" stroke-width="1.6" fill="none"/>
  <path d="M443.6 113.8L450 109L442.3 106.9" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="676" y="114" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="500" fill="#b53f1d" text-anchor="start">ändert sich mit</text>
  <rect x="452" y="148" width="200" height="46" rx="8" fill="#ffffff" stroke="#e4572e" stroke-width="1.2"/>
  <text x="464" y="168.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="start">Leistungen</text>
  <text x="464" y="184.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">zeigt den Baustein</text>
  <path d="M234 150L450 171" stroke="#e4572e" stroke-width="1.6" fill="none"/>
  <path d="M442.5 173.8L450 171L443.2 166.8" stroke="#e4572e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="676" y="176" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="500" fill="#b53f1d" text-anchor="start">ändert sich mit</text>
  <rect x="452" y="210" width="200" height="46" rx="8" fill="#f6f4f0" stroke="#9aa0a6" stroke-width="1.2"/>
  <text x="464" y="230.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#23262b" text-anchor="start">Kontakt</text>
  <text x="464" y="246.0" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Kopie der Blöcke</text>
  <path d="M234 160L450 233" stroke="#62676e" stroke-width="1.6" fill="none" stroke-dasharray="4 4"/>
  <path d="M442.1 234.0L450 233L444.3 227.4" stroke="#62676e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="676" y="238" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="500" fill="#62676e" text-anchor="start">ändert sich nicht mehr mit</text>
  <text x="32" y="292" font-family="system-ui, -apple-system, 'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#62676e" text-anchor="start">Bausteine gibt es nur auf der obersten Ebene einer Blockliste; ein Baustein enthält keine Bausteine.</text>
</svg>
